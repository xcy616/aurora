server:
  port: 8080

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/aurora?serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:aurora123}
    hikari:
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 20
      auto-commit: true
      pool-name: MyHikariCP
      max-lifetime: 60000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    lettuce:
      pool:
        min-idle: 5
        max-idle: 20
        max-active: 20
        max-wait: 10000

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000

  elasticsearch:
    rest:
      uris: ${ES_URIS:localhost:9200}

  mail:
    host: smtp.qq.com
    username: 2585424753@qq.com
    password: foblkhuhigvtdjdd
    default-encoding: UTF-8
    protocol: smtp
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          ssl:
            enable: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:aurora}

search:
  mode: mysql

upload:
  mode: minio
  oss:
    url: ${OSS_URL:http://localhost/}
    endpoint: ${OSS_ENDPOINT:local}
    accessKeyId: ${OSS_ACCESS_KEY_ID:local}
    accessKeySecret: ${OSS_ACCESS_KEY_SECRET:local}
    bucketName: ${OSS_BUCKET_NAME:local}
  minio:
    url: ${MINIO_ENDPOINT:http://localhost:9000}/
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    accesskey: ${MINIO_ACCESS_KEY:minioadmin}
    secretKey: ${MINIO_SECRET_KEY:minioadmin}
    bucketName: ${MINIO_BUCKET:aurora}

website:
  url: ${WEBSITE_URL:http://localhost:8082}

qq:
  app-id: ${QQ_APP_ID:100000000}
  check-token-url: https://graph.qq.com/oauth2.0/me?access_token={access_token}
  user-info-url: https://graph.qq.com/user/get_user_info?openid={openid}&access_token={access_token}&oauth_consumer_key={oauth_consumer_key}
