user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    # 上传文件最大 100MB（与后端 multipart 配置一致）
    client_max_body_size 100m;

    gzip  on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # ============ 博客前台 https://liliyuan.top（证书同时覆盖 www.liliyuan.top）============
    server {
        listen 443 ssl;
        server_name liliyuan.top www.liliyuan.top;

        ssl_certificate     /etc/nginx/cert/liliyuan.top.pem;
        ssl_certificate_key /etc/nginx/cert/liliyuan.top.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root  /usr/share/nginx/html/blog;
        index index.html;

        # 后端接口反代（去掉 /api 前缀，兼容 /api 与 /api/xxx）
        location /api {
            proxy_pass http://backend:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/api/?(.*)$ /$1 break;
        }

        # 图片反代：https://liliyuan.top/minio/aurora/xxx.jpg → minio:9000/aurora/xxx.jpg
        # 这样图片和网站同域名同 HTTPS，不用给 MinIO 单独申请证书
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA 路由回退，防止刷新页面 404
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ============ 管理后台 https://admin.liliyuan.top（证书放在 deploy/cert/admin.liliyuan.top.pem / .key）============
    server {
        listen 443 ssl;
        server_name admin.liliyuan.top;

        ssl_certificate     /etc/nginx/cert/admin.liliyuan.top.pem;
        ssl_certificate_key /etc/nginx/cert/admin.liliyuan.top.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root  /usr/share/nginx/html/admin;
        index index.html;

        location /api {
            proxy_pass http://backend:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/api/?(.*)$ /$1 break;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ============ 管理后台 HTTP 跳转 HTTPS ============
    server {
        listen 80;
        server_name admin.liliyuan.top;
        return 301 https://$host$request_uri;
    }

    # ============ HTTP 全部 301 跳转到 HTTPS 根域名 ============
    server {
        listen 80;
        server_name liliyuan.top www.liliyuan.top;
        return 301 https://liliyuan.top$request_uri;
    }

    # ============ 过渡期临时访问（用服务器IP + 8089 访问后台；域名全部稳定后删除本块）============
    server {
        listen 8089;
        server_name _;

        root  /usr/share/nginx/html/admin;
        index index.html;

        location /api {
            proxy_pass http://backend:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/api/?(.*)$ /$1 break;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
